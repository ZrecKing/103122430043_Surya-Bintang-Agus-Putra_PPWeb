<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Form Pendaftaran Mahasiswa</title>
</head>
<body>

    <h1>Form Pendaftaran Mahasiswa</h1>

    <form action="#" method="post">

        <label for="nama">Nama:</label><br>
        <input type="text" id="nama" name="nama"><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email"><br><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password"><br><br>

        <p>Jenis Kelamin:</p>
        <input type="radio" id="pria" name="jenis_kelamin" value="pria">
        <label for="pria">Pria</label><br>
        <input type="radio" id="wanita" name="jenis_kelamin" value="wanita">
        <label for="wanita">Wanita</label><br><br>

        <p>Hobi:</p>
        <input type="checkbox" id="membaca" name="hobi" value="membaca">
        <label for="membaca">Membaca</label><br>
        <input type="checkbox" id="olahraga" name="hobi" value="olahraga">
        <label for="olahraga">Olahraga</label><br>
        <input type="checkbox" id="musik" name="hobi" value="musik">
        <label for="musik">Musik</label><br><br>

        <label for="pendidikan">Pendidikan Terakhir:</label><br>
        <select id="pendidikan" name="pendidikan">
            <option value="sma">SMA/SMK</option>
            <option value="d3">D3</option>
            <option value="s1">S1</option>
            <option value="s2">S2</option>
        </select><br><br>

        <label for="kritik">Kritik dan Saran:</label><br>
        <textarea id="kritik" name="kritik" rows="4" cols="40"></textarea><br><br>

        <input type="submit" value="Submit">

    </form>

</body>
</html>
